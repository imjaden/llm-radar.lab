<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' fonts.googleapis.com; font-src fonts.gstatic.com; img-src 'self' data: https://pbs.twimg.com; connect-src 'self';">
  <title>LLM Radar — 行业情报仪表盘</title>
  <link rel="icon" href="static/favicon.png">
  <link rel="stylesheet" href="static/tailwind.css">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap');
    body { font-family:'Inter',-apple-system,BlinkMacSystemFont,sans-serif; font-size:14px; line-height:1.5; background:#0a0a14; color:#e0e0e0; }
    .font-mono { font-family:'JetBrains Mono',monospace; }

    /* Tab */
    .tab-active { border-bottom:2px solid #facc15; color:#facc15; }

    /* Table */
    .data-table { width:100%; border-collapse:collapse; table-layout:fixed; }
    .data-table th {
      position:sticky; top:0; z-index:10;
      background:#11111b; border-bottom:1px solid #2a2a3e;
      padding:8px 10px; text-align:left; font-size:0.7rem; font-weight:600;
      color:#9ca3af; text-transform:uppercase; letter-spacing:0.05em;
      white-space:nowrap; cursor:pointer; user-select:none;
    }
    .data-table th:hover { color:#facc15; }
    .data-table th .sort-arrow { font-size:0.6rem; margin-left:2px; opacity:0.4; }
    .data-table th.sorted .sort-arrow { opacity:1; color:#facc15; }
    .data-table td {
      padding:8px 10px; border-bottom:1px solid #1a1a2e;
      font-size:0.8rem; vertical-align:middle;
      white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
    }
    .data-table tr { transition:background 0.15s; }
    .data-table tbody tr:hover { background:rgba(79,70,229,0.08); }

    /* Hot score */
    .hot-score { display:inline-flex; align-items:center; gap:4px; font-family:'JetBrains Mono',monospace; font-size:0.8rem; font-weight:600; }
    .hot-score[data-level="5"] { color:#ef4444; }
    .hot-score[data-level="4"] { color:#f97316; }
    .hot-score[data-level="3"] { color:#eab308; }
    .hot-score[data-level="2"] { color:#22d3ee; }
    .hot-score[data-level="1"] { color:#6b7280; }

    /* Filter chips */
    .filter-chip { padding:2px 10px; border-radius:9999px; font-size:0.7rem; font-weight:500; cursor:pointer; transition:all 0.15s; border:1px solid #2a2a3e; color:#9ca3af; background:transparent; }
    .filter-chip:hover { border-color:#4f46e5; color:#e0e0e0; }
    .filter-chip.active { border-color:#facc15; color:#facc15; background:rgba(250,204,21,0.08); }
    /* 国家过滤对 X 热点 tab 不适用 (tweet 无 country 字段, O-6): 置灰, 仅源 chips 生效 */
    .filter-chip.disabled { opacity:0.35; cursor:not-allowed; pointer-events:none; }

    /* Split preview (X 热点分栏详情, §5.3) */
    .split-backdrop { position:fixed; inset:0; z-index:70; background:rgba(0,0,0,0.5); display:none; }
    .split-backdrop.show { display:block; }
    .split-preview { position:fixed; top:50%; left:50%; transform:translate(-50%,-50%); z-index:80; width:720px; max-width:92vw; max-height:80vh; background:#1e1e2e; border:1px solid #2a2a3e; border-radius:12px; box-shadow:0 8px 32px rgba(0,0,0,0.5); display:none; flex-direction:column; overflow:hidden; }
    .split-preview.show { display:flex; }
    .split-preview-header { display:flex; align-items:center; gap:6px; padding:10px 12px; border-bottom:1px solid #2a2a3e; }
    .split-preview-header .sp-title { flex:1; font-size:0.75rem; color:#9ca3af; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .sp-nav-btn, .sp-close-btn { background:transparent; border:1px solid #2a2a3e; color:#9ca3af; border-radius:6px; cursor:pointer; width:26px; height:26px; font-size:0.75rem; line-height:1; }
    .sp-nav-btn:hover, .sp-close-btn:hover { color:#facc15; border-color:#4f46e5; }
    .split-preview-body { padding:14px; overflow-y:auto; }
    .sp-full-text { font-size:0.9rem; line-height:1.6; color:#e0e0e0; white-space:pre-wrap; word-break:break-word; margin-bottom:10px; }
    .sp-meta { font-size:0.7rem; color:#9ca3af; font-family:'JetBrains Mono',monospace; margin-bottom:12px; }
    .sp-metrics { display:grid; grid-template-columns:repeat(4,1fr); gap:8px; margin-bottom:12px; }
    .sp-metric { background:#16161f; border:1px solid #2a2a3e; border-radius:8px; padding:8px; text-align:center; }
    .sp-metric-v { font-family:'JetBrains Mono',monospace; font-size:0.95rem; color:#facc15; font-weight:600; }
    .sp-metric-k { font-size:0.6rem; color:#9ca3af; margin-top:2px; }
    .sp-images { display:flex; gap:8px; overflow-x:auto; margin-bottom:12px; }
    .sp-img-wrap { flex-shrink:0; }
    .sp-img-wrap img { max-width:260px; max-height:220px; border-radius:8px; border:1px solid #2a2a3e; display:block; }
    .sp-img-fail { width:140px; height:90px; border:1px dashed #2a2a3e; border-radius:8px; display:flex; align-items:center; justify-content:center; color:#6b7280; font-size:0.7rem; }
    .sp-actions { display:flex; gap:8px; margin-top:12px; flex-wrap:wrap; }
    .sp-act { display:none; padding:4px 12px; border-radius:8px; font-size:0.75rem; cursor:pointer; background:#16161f; border:1px solid #4f46e5; color:#818cf8; text-decoration:none; align-items:center; gap:4px; }
    .sp-act:hover { color:#facc15; border-color:#facc15; background:rgba(79,70,229,0.15); }
    .sp-row-btn { display:none; padding:2px 8px; border-radius:6px; font-size:0.7rem; cursor:pointer; background:transparent; border:1px solid #4f46e5; color:#818cf8; }
    .sp-row-btn:hover { background:rgba(79,70,229,0.15); color:#facc15; }
    /* forward 行 (分栏详情, D2 2C): 与正文区分样式 */
    .sp-forward { font-size:0.85rem; line-height:1.6; color:#a5b4fc; background:rgba(99,102,241,0.08); border-left:3px solid #6366f1; padding:8px 10px; border-radius:6px; margin-bottom:10px; white-space:pre-wrap; word-break:break-word; }

    /* 全站搜索 (D4 4B) */
    .search-hl { background:rgba(250,204,21,0.35); color:#fde047; border-radius:2px; padding:0 1px; }
    .search-jump-btn { margin-left:6px; padding:1px 8px; border-radius:9999px; font-size:0.65rem; background:rgba(79,70,229,0.15); color:#a5b4fc; cursor:pointer; border:1px solid #4f46e5; }
    .search-jump-btn:hover { color:#facc15; border-color:#facc15; }

    /* Highlight */
    @keyframes hl-pulse { 0%{background:rgba(250,204,21,0.3)} 50%{background:rgba(250,204,21,0.15)} 100%{background:rgba(250,204,21,0.08)} }
    .row-highlight { animation:hl-pulse 2s ease-out; }

    /* Entity card (hotspots) */
    .entity-card { background:#1e1e2e; border:1px solid #2a2a3e; border-radius:12px; transition:border-color 0.2s,box-shadow 0.2s; }
    .entity-card:hover { border-color:#4f46e5; box-shadow:0 0 20px rgba(79,70,229,0.15); }
    .entity-card.row-highlighted,
    .row-highlighted { background:rgba(250,204,21,0.3); }

    /* Floating hotspot panel */
    .hotspot-fab { position:fixed; bottom:24px; right:24px; z-index:60; }
    .hotspot-fab-btn { width:48px; height:48px; border-radius:9999px; background:linear-gradient(135deg,#4f46e5,#f97316); color:#fff; font-size:1.2rem; cursor:pointer; border:none; box-shadow:0 4px 16px rgba(0,0,0,0.4); transition:transform 0.2s; display:flex; align-items:center; justify-content:center; }
    .hotspot-fab-btn:hover { transform:scale(1.1); }
    .hotspot-fab-btn .badge-count { position:absolute; top:-4px; right:-4px; background:#ef4444; color:#fff; font-size:0.6rem; font-weight:700; width:18px; height:18px; border-radius:9999px; display:flex; align-items:center; justify-content:center; }
    .hotspot-panel { position:fixed; bottom:80px; right:24px; z-index:60; width:360px; max-height:400px; background:#1e1e2e; border:1px solid #2a2a3e; border-radius:12px; box-shadow:0 8px 32px rgba(0,0,0,0.5); overflow:hidden; display:none; }
    .hotspot-panel.show { display:block; }
    .hotspot-panel-header { padding:10px 14px; border-bottom:1px solid #2a2a3e; display:flex; align-items:center; justify-content:between; }
    .hotspot-panel-body { overflow-y:auto; max-height:340px; padding:8px; }
    .hotspot-item { padding:8px 10px; border-radius:8px; cursor:pointer; transition:background 0.15s; }
    .hotspot-item:hover { background:rgba(79,70,229,0.12); }
    .hotspot-item-title { font-size:0.8rem; font-weight:600; color:#e0e0e0; margin-bottom:2px; }
    .hotspot-item-time { font-size:0.65rem; color:#9ca3af; font-family:'JetBrains Mono',monospace; }

    /* Chips */
    .chip {
      display:inline-flex; align-items:center; padding:1px 7px; border-radius:9999px;
      font-size:0.7rem; font-weight:500; cursor:pointer; transition:all 0.15s;
      border:1px solid transparent; white-space:nowrap; max-width:120px; overflow:hidden; text-overflow:ellipsis;
    }
    .chip:hover { border-color:#facc15; }
    .chip-provider { background:rgba(99,102,241,0.12); color:#a5b4fc; }
    .chip-person { background:rgba(236,72,153,0.12); color:#f9a8d4; }
    .chip-tool { background:rgba(34,211,238,0.12); color:#67e8f9; }
    .chip-llm { background:rgba(250,204,21,0.12); color:#fde047; }

    /* Badges */
    .badge { display:inline-block; padding:1px 6px; border-radius:4px; font-size:0.6rem; font-weight:600; white-space:nowrap; }
    .badge-tier { background:rgba(99,102,241,0.2); color:#a5b4fc; }
    .badge-open { background:rgba(34,197,94,0.12); color:#86efac; }
    .badge-closed { background:rgba(107,114,128,0.15); color:#9ca3af; }
    .badge-maturity { background:rgba(250,204,21,0.12); color:#fde047; }
    .badge-status { background:rgba(34,197,94,0.12); color:#86efac; }

    /* Event text */
    .event-text { white-space:normal; line-height:1.4; max-width:320px; }
    .event-text a { color:#818cf8; text-decoration:none; }
    .event-text a:hover { color:#facc15; }

    /* Influence colors */
    .infl-leader { color:#facc15; }
    .infl-core { color:#818cf8; }
    .infl-active { color:#22d3ee; }
    .infl-rising { color:#86efac; }

    /* Scrollbar */
    ::-webkit-scrollbar { width:6px; height:6px; }
    ::-webkit-scrollbar-track { background:#0a0a14; }
    ::-webkit-scrollbar-thumb { background:#2a2a3e; border-radius:3px; }
    ::-webkit-scrollbar-thumb:hover { background:#4f46e5; }

    /* Loading */
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.5} }
    .loading-pulse { animation:pulse 2s cubic-bezier(.4,0,.6,1) infinite; }

    /* Responsive: hide columns on small screens */
    @media (max-width:768px) {
      .hide-mobile { display:none !important; }
      .data-table td, .data-table th { padding:6px 6px; font-size:0.7rem; }
    }
    /* Responsive: hide source chips and filter chips on mid screens */
    @media (max-width:1200px) {
      .hide-1200 { display:none !important; }
      /* 窄屏: 分栏变全屏抽屉 (底部滑出, ~85vh, §5.5); 行内"详情"按钮显示 (7C) */
      .split-preview { top:auto; bottom:0; left:0; right:0; width:100%; max-width:100%; max-height:85vh; border-radius:12px 12px 0 0; transform:none; }
      .sp-row-btn { display:inline-flex; }
    }
    /* GitHub icon */
    .github-icon { display: inline-flex; vertical-align: middle; opacity: 0.7; transition: opacity 0.15s; }
    .github-icon:hover { opacity: 1; }
    .github-icon svg { width: 20px; height: 20px; fill: #c9d1d9; }
  </style>
</head>
<body class="min-h-screen">

  <!-- Header -->
  <header class="border-b border-gray-800 bg-surface-900/80 backdrop-blur-sm sticky top-0 z-50">
    <div class="max-w-[1400px] mx-auto px-4 sm:px-6 py-2">
      <div class="flex items-center gap-2 text-xs">
        <div class="flex items-center gap-2">
          <a class="w-5 h-5 rounded" href="https://github.com/imjaden" target="_blank" rel="noopener noreferrer" title="GitHub">
          <img src="static/favicon.png" alt="R">
          </a>
          <a class="w-5 h-5 rounded github-icon" href="https://github.com/imjaden/llm-radar.lab" target="_blank" rel="noopener noreferrer" title="GitHub"><svg viewBox="0 0 16 16"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27s1.36.09 2 .27c1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0 0 16 8c0-4.42-3.58-8-8-8"/></svg></a>
          <span class="font-bold text-white text-sm">LLM Radar</span>
        </div>
        <span class="hide-1200 text-gray-600">|</span>
        <span class="hide-1200 text-gray-500">数据源:</span>
        <span id="data-sources" class="hide-1200 text-gray-400"></span>
        <div class="ml-auto flex items-center gap-2">
          <span id="updated-at" class="font-mono text-gray-400"></span>
          <span id="ago-label" class="cursor-default font-mono px-1.5 py-0.5 rounded text-xs"></span>
          <label class="flex items-center gap-1 cursor-pointer select-none" title="开启后每10分钟自动刷新">
            <span class="text-gray-500 text-xs">自动刷新</span>
            <span id="auto-toggle" class="relative inline-block w-7 h-4 rounded-full bg-gray-700 transition-colors" onclick="toggleAutoRefresh()">
              <span id="auto-knob" class="absolute top-0.5 left-0.5 w-3 h-3 rounded-full bg-gray-400 transition-all"></span>
            </span>
          </label>
        </div>
      </div>
      <!-- 全站搜索 (D4 4B): 输入过滤当前 tab + 跨 tab 计数; 窄屏保留 (工具条可滚动) -->
      <div class="flex items-center gap-2 mt-1.5">
        <input id="header-search" type="search" placeholder="搜索全站… (⌘F)"
               autocomplete="off" aria-label="全站搜索"
               class="flex-1 min-w-0 max-w-md bg-gray-800 border border-gray-700 rounded-md px-2.5 py-1 text-xs text-gray-200 placeholder-gray-500 focus:outline-none focus:border-cobalt-500"
               oninput="onSearchInput()" onkeydown="onSearchKey(event)">
        <div id="search-summary" class="text-xs text-gray-500 whitespace-nowrap overflow-x-auto"></div>
      </div>
    </div>
  </header>

  <!-- Tabs -->
  <nav class="border-b border-gray-800 bg-surface-900/50 sticky top-[45px] z-40">
    <div class="max-w-[1400px] mx-auto px-4 sm:px-6">
      <div class="flex items-center gap-0 overflow-x-auto" id="tab-bar">
        <button class="tab-btn px-4 py-2.5 text-sm font-medium whitespace-nowrap transition-colors hover:text-white" data-tab="tools">🔧 工具 <span class="ml-1 text-xs opacity-60" id="tc-tools">0</span></button>
        <button class="tab-btn px-4 py-2.5 text-sm font-medium whitespace-nowrap transition-colors hover:text-white" data-tab="llms">🤖 大模型 <span class="ml-1 text-xs opacity-60" id="tc-llms">0</span></button>
        <button class="tab-btn px-4 py-2.5 text-sm font-medium whitespace-nowrap transition-colors hover:text-white" data-tab="providers">🏢 厂商 <span class="ml-1 text-xs opacity-60" id="tc-providers">0</span></button>
        <button class="tab-btn px-4 py-2.5 text-sm font-medium whitespace-nowrap transition-colors hover:text-white" data-tab="people">👤 人物 <span class="ml-1 text-xs opacity-60" id="tc-people">0</span></button>
        <button class="tab-btn px-4 py-2.5 text-sm font-medium whitespace-nowrap transition-colors hover:text-white" data-tab="hotspots">🔥 热点 <span class="ml-1 text-xs opacity-60" id="tc-hotspots">0</span></button>
        <button class="tab-btn px-4 py-2.5 text-sm font-medium whitespace-nowrap transition-colors hover:text-white" data-tab="xhotspots">X热点 <span class="ml-1 text-xs opacity-60" id="tc-xhotspots">0</span></button>
        <div class="hide-1200 flex items-center gap-1.5 ml-auto pl-4">
          <button class="filter-chip active" data-filter="all" onclick="setFilter('all')">全部</button>
          <button class="filter-chip" data-filter="cn" onclick="setFilter('cn')">🇨🇳 中国</button>
          <button class="filter-chip" data-filter="global" onclick="setFilter('global')">🌍 海外</button>
        </div>
      </div>
    </div>
  </nav>

  <!-- Overview preview: shows immediately via overview.json -->
  <div id="overview-preview" class="max-w-[1400px] mx-auto px-4 sm:px-6 py-2 hidden">
    <div class="flex items-center gap-4 flex-wrap text-xs text-gray-400">
      <span class="text-gray-500">更新于</span>
      <span id="ov-update" class="text-white font-mono"></span>
      <span class="text-gray-600">·</span>
      <span id="ov-status" class="px-1.5 py-0.5 rounded text-xs"></span>
    </div>
    <div id="ov-hotspots" class="flex items-center gap-3 mt-1.5 flex-wrap"></div>
  </div>

  <!-- Skeleton: placeholder while snapshot loads -->
  <div id="skeleton" class="max-w-[1400px] mx-auto px-4 sm:px-6 py-4">
    <div class="space-y-3">
      <div class="h-4 w-1/3 bg-gray-800 animate-pulse rounded"></div>
      <div class="h-4 w-1/2 bg-gray-800 animate-pulse rounded"></div>
      <div class="h-4 w-2/3 bg-gray-800 animate-pulse rounded"></div>
      <div class="h-4 w-1/4 bg-gray-800 animate-pulse rounded mt-4"></div>
      <div class="h-4 w-3/4 bg-gray-800 animate-pulse rounded"></div>
      <div class="h-4 w-2/5 bg-gray-800 animate-pulse rounded"></div>
    </div>
  </div>

  <!-- Error message -->
  <div id="error-msg" class="max-w-[1400px] mx-auto px-4 sm:px-6 py-20 text-center hidden">
    <div class="text-red-400 text-lg">❌ 数据加载失败，请稍后刷新</div>
  </div>

  <!-- Main -->
  <main class="max-w-[1400px] mx-auto px-4 sm:px-6 py-4">
    <div id="loading" class="flex items-center justify-center py-20">
      <div class="text-center">
        <div class="w-10 h-10 border-2 border-cobalt-500 border-t-transparent rounded-full animate-spin mx-auto mb-3"></div>
        <p class="text-gray-500 text-sm">加载情报数据...</p>
      </div>
    </div>
    <div id="error-state" class="hidden text-center py-20">
      <p class="text-gray-500 text-lg mb-2">暂无数据</p>
      <p class="text-gray-600 text-sm">请确保 <code class="font-mono bg-gray-800 px-2 py-0.5 rounded">data/snapshot.json</code> 存在</p>
    </div>
    <div id="panel-hotspots" class="tab-panel hidden"></div>
    <div id="panel-xhotspots" class="tab-panel hidden"></div>
    <div id="panel-providers" class="tab-panel hidden"></div>
    <div id="panel-people" class="tab-panel hidden"></div>
    <div id="panel-tools" class="tab-panel hidden"></div>
    <div id="panel-llms" class="tab-panel hidden"></div>
  </main>

  <!-- Floating Hotspot Panel -->
  <div class="hotspot-fab" id="hotspot-fab" style="display:none">
    <button class="hotspot-fab-btn relative" onclick="toggleHotspotPanel()" title="最近热点">
      🔥
      <span class="badge-count" id="hotspot-badge" style="display:none">0</span>
    </button>
  </div>
  <div class="hotspot-panel" id="hotspot-panel">
    <div class="hotspot-panel-header">
      <span class="text-sm font-semibold text-white">🔥 最近热点</span>
      <button class="text-gray-400 hover:text-white text-xs ml-auto" onclick="toggleHotspotPanel()">✕</button>
    </div>
    <div class="hotspot-panel-body" id="hotspot-panel-body"></div>
  </div>

  <!-- X 热点分栏详情 (split-preview, 仅 X热点 tab 生效 §5.3) -->
  <div id="split-backdrop" class="split-backdrop" onclick="closeSplitPreview()"></div>
  <div id="split-preview" class="split-preview">
    <div class="split-preview-header">
      <button class="sp-nav-btn" onclick="spNav(-1)" title="上一条">←</button>
      <button class="sp-nav-btn" onclick="spNav(1)" title="下一条">→</button>
      <span class="sp-title" id="sp-title"></span>
      <button class="sp-close-btn" onclick="closeSplitPreview()" title="关闭">✕</button>
    </div>
    <div class="split-preview-body">
      <div class="sp-full-text" id="sp-full-text"></div>
      <div class="sp-forward" id="sp-forward"></div>
      <div class="sp-meta" id="sp-meta"></div>
      <div class="sp-metrics" id="sp-metrics"></div>
      <div class="sp-images" id="sp-images"></div>
      <div class="sp-actions">
        <a class="sp-act" id="sp-act-link" href="#" target="_blank" rel="noopener noreferrer" title="打开原文">🔗</a>
        <a class="sp-act" id="sp-act-profile" href="#" target="_blank" rel="noopener noreferrer" title="作者主页">👤</a>
        <button class="sp-act" id="sp-act-copy" type="button" title="拷贝推广内容">📋</button>
      </div>
    </div>
  </div>

  <footer class="border-t border-gray-800 mt-8 py-4 text-center text-xs text-gray-600">
    LLM Radar · Industry Intelligence Dashboard · v1.5
  </footer>

<script>
/* ========================================================================
 * LLM Radar — Table Layout
 * Version: 1.0(2026-06-11)
 * Karpathy: 简单 → 表格 > 卡片，信息密度优先
 * ======================================================================== */

// Timestamp refresh — cache bust
(function(){
  var p = new URLSearchParams(window.location.search);
  var t = p.get('t');
  var oneHour = 60 * 60 * 1000;
  if (!t || (Date.now() - parseInt(t)) > oneHour) {
    p.set('t', Date.now());
    window.location.replace(window.location.pathname + '?' + p.toString() + (window.location.hash||''));
  }
})();

let DATA = null;
const TABS = ['tools','llms','providers','people','hotspots','xhotspots'];
let activeTab = 'llms';
let sortState = {}; // { tab: { col, dir } }
let filterMode = 'all'; // 'all' | 'cn' | 'global'
let sourceFilter = null; // null=全部, or source name string

// 渲染缓存 (D4): key = tab|filterMode|sourceFilter|sortState 复合状态;
// 数据刷新 (refreshData/loadTwitterData 成功) 后整体失效
const RENDER_CACHE = {};
function clearRenderCache() { Object.keys(RENDER_CACHE).forEach(k => delete RENDER_CACHE[k]); }

// Data sources
const SOURCES = [
  {name:'量子位', url:'https://www.qbitai.com'},
  {name:'机器之心', url:'https://www.jiqizhixin.com'},
  {name:'InfoQ', url:'https://www.infoq.cn/topic/AI'},
  {name:'36氪', url:'https://36kr.com/search/articles/大模型'},
  {name:'TechCrunch', url:'https://techcrunch.com/category/artificial-intelligence/'},
  {name:'GitHub', url:'https://github.com/trending'},
  {name:'HuggingFace', url:'https://huggingface.co/papers'},
  {name:'X', url:'https://x.com'},
];

// ===== Filters =====
function isCN(entity) {
  if (entity.country === '中国') return true;
  const name = (entity.name||'') + (entity.name_en||'') + (entity.id||'');
  return /\p{Script=Han}/u.test(name);
}
function filterItems(arr) {
  let out = arr;
  // CN/Global filter
  if (filterMode === 'cn') out = out.filter(isCN);
  else if (filterMode === 'global') out = out.filter(e => !isCN(e));
  // Source filter
  if (sourceFilter) {
    out = out.filter(e => matchesSource(e, sourceFilter));
  }
  return out;
}
function setFilter(mode) {
  filterMode = mode;
  document.querySelectorAll('.filter-chip').forEach(b => b.classList.toggle('active', b.dataset.filter === mode));
  renderTab(activeTab);
}
// Source filter: check if entity's URLs or source name match a source
function matchesSource(entity, srcName) {
  const src = SOURCES.find(s => s.name === srcName);
  if (!src) return true;
  const srcDomain = src.url.replace(/^https?:\/\/(?:www\.)?([^\/]+).*/,'$1');
  // Hotspots have a direct source field
  if (entity.source && entity.source === srcName) return true;
  // X 是单字母, includes('x') 过宽 → 精确匹配 (O-6)
  if (entity.source && (srcName === 'X'
    ? entity.source === 'X'
    : entity.source.toLowerCase().includes(srcName.toLowerCase()))) return true;
  // Check URLs
  const urls = [entity.website, entity.official_website, entity.last_event_url, entity.recent_activity_url, entity.last_update_url];
  for (const u of urls) {
    if (u && u.includes(srcDomain)) return true;
  }
  return false;
}
function toggleSource(name) {
  sourceFilter = sourceFilter === name ? null : name;
  renderSourceChips();
  renderTab(activeTab);
}
function renderSourceChips() {
  document.getElementById('data-sources').innerHTML = SOURCES.map(s => {
    const active = sourceFilter === s.name;
    return `<span class="inline-flex items-center gap-0.5 bg-gray-800 rounded px-1.5 py-0.5 text-xs cursor-pointer hover:bg-gray-700 ${active?'ring-1 ring-accent-400 bg-gray-700':''}" onclick="toggleSource('${s.name}')" title="${active?'取消筛选':'筛选 ' + s.name + ' 相关实体'}">${s.name}</span>`;
  }).join(' ');
}

// ===== Auto Refresh =====
let autoRefreshTimer = null;
let autoRefreshEnabled = false;

function toggleAutoRefresh() {
  autoRefreshEnabled = !autoRefreshEnabled;
  const toggle = document.getElementById('auto-toggle');
  const knob = document.getElementById('auto-knob');
  if (autoRefreshEnabled) {
    toggle.style.background = '#4f46e5';
    knob.style.left = '14px';
    knob.style.background = '#fff';
    startAutoRefresh();
  } else {
    toggle.style.background = '#374151';
    knob.style.left = '2px';
    knob.style.background = '#9ca3af';
    stopAutoRefresh();
  }
  localStorage.setItem('llm-radar-auto-refresh', autoRefreshEnabled ? '1' : '0');
}

function startAutoRefresh() {
  stopAutoRefresh();
  autoRefreshTimer = setInterval(() => { refreshData(); }, 10 * 60 * 1000);
}

function stopAutoRefresh() {
  if (autoRefreshTimer) { clearInterval(autoRefreshTimer); autoRefreshTimer = null; }
}

async function refreshData() {
  saveState();
  try {
    const r = await fetch('data/snapshot.json', {cache:'no-cache'});
    if (r.ok) { DATA = await r.json(); clearRenderCache(); }
  } catch(e) {}
  restoreState();
  renderTab(activeTab);
  updateStats();
  checkRecentHotspots();
  loadTwitterData();
}

function saveState() {
  const scrollY = window.scrollY;
  const panel = document.getElementById(`panel-${activeTab}`);
  const scrollTable = panel ? panel.scrollTop : 0;
  localStorage.setItem('llm-radar-state', JSON.stringify({
    tab: activeTab, filter: filterMode,
    sort: sortState[activeTab] || null,
    scrollY, scrollTable
  }));
}

function restoreState() {
  try {
    const raw = localStorage.getItem('llm-radar-state');
    if (!raw) return;
    const st = JSON.parse(raw);
    if (st.tab && TABS.includes(st.tab)) activeTab = st.tab;
    if (st.filter) { filterMode = st.filter; document.querySelectorAll('.filter-chip').forEach(b => b.classList.toggle('active', b.dataset.filter === filterMode)); }
    if (st.sort) sortState[activeTab] = st.sort;
    if (st.scrollY) requestAnimationFrame(() => window.scrollTo(0, st.scrollY));
  } catch(e) {}
}

// ===== Helpers =====
function hl(s) { return s>=80?5:s>=60?4:s>=40?3:s>=20?2:1; }
function he(l) { return {5:'🔥',4:'🟠',3:'🟡',2:'🔵',1:'⚪'}[l]||'⚪'; }
// XSS 输出编码 (SEC-1): 转义 & < > " ' ` ; 渲染路径全字段强制转义
function esc(s) {
  if (s == null) return '';
  return String(s).replace(/[&<>"'`]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;','`':'&#96;'}[c]));
}
// Search icon: 基于 Bing 搜索操作符，参考 search-tips.md 的 site: 限定
// 格式: https://cn.bing.com/search?q=keyword+site%3Adomain.com
function searchIcon(name, site) {
  if (!name) return '';
  let q = name.replace(/"/g,'');
  if (site) {
    // 取纯域名（去掉协议和路径）
    const d = site.replace(/^https?:\/\//, '').replace(/\/.*$/, '');
    if (d && !/localhost|example|xxx|xxxx/.test(d)) q += '+site%3A' + d;
  }
  // encodeURIComponent(q) 确保特殊字符如 + 被正确编码
  return `<a href="https://cn.bing.com/search?q=${q}" target="_blank" rel="noopener" class="inline-block ml-1 text-gray-600 hover:text-accent-400 text-xs" title="Bing 搜索「${esc(name)}」">🔍</a>`;
}
// Event cell enhanced: 事件链接旁加搜索图标
function smartEventCell(text, url, date, searchName) {
  if(!text) return '<span class="text-gray-600">—</span>';
  let h=`<div class="event-text">${esc(text)}`;
  if(url && !/xxx|xxxx|example|localhost|0\.0\.0\.0/.test(url)) {
    h+=` <a href="${esc(url)}" target="_blank" rel="noopener" class="text-cobalt-400 hover:text-accent-400">↗</a>`;
    if(searchName) h+=searchIcon(searchName, url);
  }
  if(date) h+=` <span class="text-gray-500 text-xs ml-1">${dateAgo(date)}</span>`;
  return h+'</div>';
}
function findEntity(id) {
  if(!DATA) return null;
  for(const d of ['providers','people','tools','llms']) {
    const f=DATA[d].find(e=>e.id===id);
    if(f) return {entity:f,dim:d};
  }
  return null;
}
function chip(id,dim) {
  const r=findEntity(id); if(!r) return '';
  const cls={providers:'chip-provider',people:'chip-person',tools:'chip-tool',llms:'chip-llm'}[dim]||'chip-llm';
  const label=r.entity.name||r.entity.name_en||id;
  return `<span class="chip ${cls}" onclick="nav('${dim}','${esc(id)}')" title="${esc(label)}">${esc(label)}</span>`;
}
function chips(arr,dim,max) {
  if(!arr||!arr.length) return '<span class="text-gray-600">—</span>';
  const shown=arr.slice(0,max||3);
  let html=shown.map(id=>chip(id,dim)).join(' ');
  if(arr.length>(max||3)) html+=` <span class="text-gray-500 text-xs">+${arr.length-(max||3)}</span>`;
  return html;
}
function hotScore(s) {
  const l=hl(s);
  return `<span class="hot-score" data-level="${l}">${he(l)} ${s}</span>`;
}
function dateAgo(d) {
  if(!d) return '';
  const diff=Math.floor((Date.now()-new Date(d))/86400000);
  return diff===0?'<span class="text-accent-400">今天</span>':diff===1?'<span class="text-gray-400">昨天</span>':`<span class="text-gray-500">${diff}天前</span>`;
}
function eventCell(text,url,date) {
  if(!text) return '<span class="text-gray-600">—</span>';
  let h=`<div class="event-text">${esc(text)}`;
  if(url && !/xxx|xxxx|example|localhost|0\.0\.0\.0/.test(url)) h+=` <a href="${esc(url)}" target="_blank" rel="noopener">↗</a>`;
  if(date) h+=` <span class="text-gray-500 text-xs ml-1">${dateAgo(date)}</span>`;
  return h+'</div>';
}
function num(v) { return v!=null?v:'—'; }

// ===== Sort =====
function sortData(arr,tab,col,dir) {
  const sorted=[...arr];
  sorted.sort((a,b)=>{
    let va=a[col], vb=b[col];
    if(typeof va==='string') return dir==='asc'?va.localeCompare(vb):vb.localeCompare(va);
    if(typeof va==='number') return dir==='asc'?'va-vb':vb-va;
    return 0;
  });
  return sorted;
}
function toggleSort(tab,col) {
  const s=sortState[tab];
  if(s&&s.col===col) { s.dir=s.dir==='desc'?'asc':'desc'; }
  else { sortState[tab]={col,dir:'desc'}; }
  renderTab(tab);
}

// ===== Render: Hotspots =====
function renderHotspots() {
  const items = filterItems(DATA.hotspots||[]).slice().sort((a,b) => (b.date||'').localeCompare(a.date||''));
  if (!items.length) return '<div class="text-center text-gray-500 py-12">暂无热点数据</div>';
  return items.map(h => {
    const providers = (h.related_providers||[]).map(id => chip(id,'providers')).join(' ');
    const people = (h.related_people||[]).map(id => chip(id,'people')).join(' ');
    const tools = (h.related_tools||[]).map(id => chip(id,'tools')).join(' ');
    const llms = (h.related_llms||[]).map(id => chip(id,'llms')).join(' ');
    const related = [providers,people,tools,llms].filter(Boolean).join(' ');
    return `
    <div class="entity-card p-4 mb-3" id="entity-${esc(h.id)}">
      <div class="flex items-start justify-between mb-2">
        <div class="min-w-0 flex-1">
          <div class="flex items-center gap-2 mb-1">
            <span class="font-mono text-xs text-gray-500">${esc(h.date||'')}</span>
            ${h.source?`<span class="badge bg-gray-800 text-gray-400">${esc(h.source)}</span>`:''}
          </div>
          <h3 class="font-semibold text-white text-sm mb-1">${esc(h.title||'')}</h3>
          <p class="text-sm text-gray-400 leading-relaxed">${esc(h.summary||'')}</p>
        </div>
      </div>
      ${related?`<div class="flex flex-wrap gap-1.5 mt-2 pt-2 border-t border-gray-800">${related}</div>`:''}
      ${h.url?`<a href="${esc(h.url)}" target="_blank" rel="noopener" class="text-xs text-cobalt-400 hover:text-cobalt-300 mt-2 inline-block">阅读原文 ↗</a>`:''}
      ${searchIcon(h.title||'', h.url)}
    </div>`;
  }).join('');
}

// === Emoji Mapping ===

o':'🌀','gpt-5.4':'🌀',gpt5:'🌀','gpt-live':'🌀','chatgpt-work':'🌀',claude:'🧬','claude-sonnet-5':'🧬','claude-fable-5':'🧬','claude-mythos-5':'🧬','fable-5-model':'🧬','mythos-5':'🧬','sonnet-5':'🧬','gemini-3-1-ultra':'🔮','gemini-omni-flash':'🔮','gemma-4':'🔮',grok:'⚙️',deepseek:'🐋','deepseek-v4-flash':'🐋','deepseek-apple':'🐋',qwen3:'🛒','qwen3-4b':'🛒','qwen3-vl-8b':'🛒',qianwen:'🛒',glm:'🏛️','glm-5-2':'🏛️','hunyuan-hy3':'🐧',hy3:'🐧','seed-2-1':'🎵','seed-2.1':'🎵',kling:'🎨',tiangong:'🏔️','lingbot-world-model-2-0':'🐜','lingbot-world-model-2.0':'🐜','ant-lingbo-world-model-2-0':'🐜','lingbot-va-2-0':'🐜','lingbot-video':'🐜','lingbot-depth-2-0':'🐜','minimax-m1':'🌬️','vidu-s1':'🎥','meituan-trillion-llm':'🛵','meituan-zero-nvidia-trillion-model':'🛵','longcat-2.0':'🛵',alphafold:'🔬'}};
var DIM_EM={providers:'🏢',people:'👤',tools:'🔧',llms:'🧠',hotspots:'🔥'};
function entEmoji(dim,id){var m=EMOJI_M[dim];if(m&&m[id])return m[id];if(dim==='llms'&&m&&id){var pf=['gpt-','claude-','gemini-','grok','deepseek','qwen','glm-','hunyuan','seed-','lingbot-','meituan-'];for(var p=0;p<pf.length;p++)if(id.indexOf(pf[p])===0)for(var k in m)if(k.indexOf(pf[p])===0)return m[k];}return DIM_EM[dim]||'❓';}

// ===== Render: Providers =====
function renderProviders() {
  const s=sortState.providers||{col:'hot_score',dir:'desc'};

  const th=(col,label,w,cls)=>`<th class="${cls||''} ${s.col===col?'sorted':''}" style="${w?'width:'+w:''}" onclick="toggleSort('providers','${col}')">${label}<span class="sort-arrow">${s.col===col?(s.dir==='desc'?'▼':'▲'):'↕'}</span></th>`;

// ===== Render: People =====
function renderPeople() {
  const s=sortState.people||{col:'hot_score',dir:'desc'};
  const items=sortData(filterItems(DATA.people),'people',s.col,s.dir);
  const infl={行业领袖:'infl-leader',核心人物:'infl-core',活跃人物:'infl-active',新锐:'infl-rising'};
  const th=(col,label,w,cls)=>`<th class="${cls||''} ${s.col===col?'sorted':''}" style="${w?'width:'+w:''}" onclick="toggleSort('people','${col}')">${label}<span class="sort-arrow">${s.col===col?(s.dir==='desc'?'▼':'▲'):'↕'}</span></th>`;
  return `<table class="data-table"><thead><tr>

  </tr></thead><tbody>${items.map(p=>{
    const employer=chip(p.employer_id,'providers');
    return `<tr id="entity-${p.id}" data-id="${p.id}">
      <td><div class="flex items-center gap-2"><div class="w-7 h-7 rounded-full bg-pink-900/30 border border-pink-800/50 flex items-center justify-center text-sm flex-shrink-0">${entEmoji('people',p.id)}</div><div class="min-w-0" title="${p.id}"><div class="font-semibold text-white text-sm truncate">${p.name}${searchIcon(p.name, '')}</div>${p.name_en&&p.name_en!==p.name?`<div class="text-xs text-gray-500 truncate">${p.name_en}</div>`:''}</div></div></td>
      <td><span class="badge text-xs ${infl[p.influence_level]||''} bg-transparent border border-current/20">${p.influence_level||'—'}</span></td>

// ===== 全站搜索 (D4 4B, SEC-1) =====
let searchQuery = '';
let searchTimer = null;
const SEARCH_TAB_LABELS = {tools:'工具',llms:'模型',providers:'厂商',people:'人物',hotspots:'热点',xhotspots:'X热点'};

function onSearchInput() {
  clearTimeout(searchTimer);
  searchTimer = setTimeout(doSearch, 200);   // 防抖 ~200ms
}
function onSearchKey(e) {
  if (e.key === 'Enter') { clearTimeout(searchTimer); doSearch(); }
  else if (e.key === 'Escape') {
    const input = document.getElementById('header-search');
    if (input.value) { input.value = ''; doSearch(); }   // 清空恢复全表
    else input.blur();

}
function doSearch() {
  const input = document.getElementById('header-search');
  searchQuery = (input ? input.value : '').trim();
  renderTab(activeTab);
}
// 匹配文本构建 (name/文本/forward/人物/链接, 大小写不敏感)
function searchHaystack(item, tab) {
  if (tab === 'xhotspots') {
    const f = item || {}, t = f.tweet || {}, tg = f.target || {};
    return [tg.name, tg.handle, t.text, t.forward, t.url, t.id, t.posted_at]
      .filter(v => v != null).join(' ').toLowerCase();
  }
  const it = item || {};
  const parts = [it.name, it.name_en, it.id, it.title, it.description, it.category,
                 it.last_event, it.recent_activity, it.last_update, it.last_event_url,
                 it.recent_activity_url, it.last_update_url, it.website,
                 it.official_website, it.url, it.influence_level, it.type, it.tier];
  if (Array.isArray(it.known_for)) parts.push(it.known_for.join(' '));
  if (Array.isArray(it.capabilities)) parts.push(it.capabilities.join(' '));
  return parts.filter(v => v != null).join(' ').toLowerCase();
}
function countSearchMatches(tab) {
  if (!searchQuery) return 0;
  if (tab === 'xhotspots') {
    if (!X_DATA) return 0;
    return X_FLAT.filter(f => searchHaystack(f, 'xhotspots').includes(searchQuery.toLowerCase())).length;
  }
  if (!DATA) return 0;
  return (DATA[tab] || []).filter(it => searchHaystack(it, tab).includes(searchQuery.toLowerCase())).length;
}
// 跨 tab 计数汇总: "当前 N" + 其他 tab 计数按钮 (点击跳转, 查询保留)
function updateSearchSummary() {
  const el = document.getElementById('search-summary');
  if (!el) return;
  el.textContent = '';
  if (!searchQuery) return;
  const q = searchQuery.toLowerCase();
  const curN = countSearchMatches(activeTab);
  const cur = document.createElement('span');
  cur.className = 'text-gray-400';
  cur.textContent = '当前 ' + curN;
  el.appendChild(cur);
  TABS.forEach(tab => {
    if (tab === activeTab) return;
    const n = countSearchMatches(tab);
    if (!n) return;
    const b = document.createElement('button');
    b.className = 'search-jump-btn';
    b.textContent = (SEARCH_TAB_LABELS[tab] || tab) + ' ' + n;
    b.onclick = () => switchTab(tab);
    el.appendChild(b);
  });
}
// 当前 tab 行过滤 (name/文本/forward/人物/链接): 无匹配行隐藏 + 高亮
function applySearchFilter(panel) {
  if (!panel) return;
  const q = searchQuery.toLowerCase();
  if (!q) return;
  const rows = panel.querySelectorAll('tbody tr, .entity-card');
  if (!rows.length) return;
  let visible = 0;
  rows.forEach(el => {
    const hay = (el.textContent || '').toLowerCase();
    const hasLink = Array.from(el.querySelectorAll('a[href]')).some(a =>
      (a.getAttribute('href') || '').toLowerCase().includes(q));
    const show = hay.includes(q) || hasLink;
    el.style.display = show ? '' : 'none';
    if (show) visible++;
  });
  if (!visible) {
    const note = document.createElement('div');
    note.className = 'text-center text-gray-500 py-12';
    note.textContent = '无匹配结果';
    panel.appendChild(note);
  }
  highlightMatches(panel, searchQuery);
}
// 高亮: 结构化 DOM 构建 (span + textContent 分片), 禁 innerHTML (SEC-1)
function highlightMatches(root, q) {
  if (!q || !root) return;
  const needle = q.toLowerCase();
  root.querySelectorAll('.search-hl').forEach(s => {
    const t = document.createTextNode(s.textContent || '');
    s.parentNode.replaceChild(t, s);
  });
  const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT);
  const hits = [];
  while (walker.nextNode()) {
    const t = walker.currentNode;
    if (t.nodeValue && t.nodeValue.toLowerCase().includes(needle)) hits.push(t);
  }
  hits.forEach(t => {
    const v = t.nodeValue || '';
    const lower = v.toLowerCase();
    const frag = document.createDocumentFragment();
    let i = 0;
    for (;;) {
      const idx = lower.indexOf(needle, i);
      if (idx < 0) { frag.appendChild(document.createTextNode(v.slice(i))); break; }
      if (idx > i) frag.appendChild(document.createTextNode(v.slice(i, idx)));
      const span = document.createElement('span');
      span.className = 'search-hl';
      span.textContent = v.slice(idx, idx + q.length);
      frag.appendChild(span);
      i = idx + q.length;
    }
    t.parentNode.replaceChild(frag, t);
  });
}
// Cmd+F (macOS) / Ctrl+F (跨平台, O-3): preventDefault + 聚焦; 已聚焦时无操作
document.addEventListener('keydown', (e) => {
  if ((e.metaKey || e.ctrlKey) && (e.key === 'f' || e.key === 'F')) {
    const input = document.getElementById('header-search');
    if (input && document.activeElement !== input) {

    }
  }
});

// ===== X 热点 (data/twitter.json, §5.1) =====
let X_DATA = null;   // twitter.json 原始文档
let X_FLAT = [];     // 展平后的推文引用 [{targetIndex, target, tweet}]
let X_ITEMS = [];    // 当前渲染顺序的展平列表 (分栏索引基于此)
let X_CUR = null;    // 当前分栏索引

function xTweetCount() {
  if (!X_DATA) return 0;
  if (sourceFilter && sourceFilter !== 'X') return 0;
  return X_FLAT.length;
}

function flattenTwitter(data) {
  const out = [];
  (data.targets || []).forEach((tg, ti) => {
    (tg.tweets || []).forEach(tw => {
      out.push({ targetIndex: ti, target: tg, tweet: tw });
    });
  });
  return out;
}

// 时间显示 MM-DD HH:MM (UTC → 本地, §5.2)
function fmtMMDD(iso) {
  if (!iso) return '—';
  const d = new Date(iso);
  if (isNaN(d.getTime())) return '—';
  const p = n => String(n).padStart(2, '0');
  return p(d.getMonth() + 1) + '-' + p(d.getDate()) + ' ' + p(d.getHours()) + ':' + p(d.getMinutes());
}

// 完整时间 YYYY-MM-DD HH:MM (本地, 复用 fmtMMDD padding, §3.4; null → "—")
function fmtFull(iso) {
  if (!iso) return '—';
  const d = new Date(iso);
  if (isNaN(d.getTime())) return '—';
  const p = n => String(n).padStart(2, '0');
  return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate()) + ' ' + p(d.getHours()) + ':' + p(d.getMinutes());
}

async function loadTwitterData() {
  try {
    const r = await fetch('data/twitter.json', {cache:'no-cache'});
    if (!r.ok) throw new Error('HTTP ' + r.status);
    X_DATA = await r.json();
    X_FLAT = flattenTwitter(X_DATA);
    clearRenderCache();
  } catch(e) {
    X_DATA = null;
    X_FLAT = [];
    clearRenderCache();
    console.warn('[llm-radar] twitter.json load failed:', e.message);
  }
  if (activeTab === 'xhotspots') renderTab('xhotspots');
  updateStats();
}

// 摘要: 有 forward 时 `{text}\nforward: {forward}` 截断 (text 空则仅 forward 行, §5.1)
function xSummaryText(t, limit) {
  const lines = [];
  if (t.text) lines.push(t.text);
  if (t.forward) lines.push('forward: ' + t.forward);
  let raw = lines.join('\n');
  if (limit && raw.length > limit) raw = raw.slice(0, limit) + '…';
  return raw;
}

// ===== Render: X 热点表格 (§5.2) =====
function renderXHotspots() {
  const countEl = document.getElementById('tc-xhotspots');
  if (!X_DATA) {
    if (countEl) countEl.textContent = 0;
    return '<div class="text-center text-gray-500 py-12">暂无 X 数据</div>';
  }
  // 国家过滤对 X tab 不适用 (tweet 无 country 字段, O-6): 仅源 chips 生效
  if (sourceFilter && sourceFilter !== 'X') {
    if (countEl) countEl.textContent = 0;
    return '<div class="text-center text-gray-500 py-12">当前源筛选下无 X 数据</div>';
  }
  const items = X_FLAT.slice().sort((a, b) =>
    (b.tweet.posted_at || '') < (a.tweet.posted_at || '') ? -1 :
    (b.tweet.posted_at || '') > (a.tweet.posted_at || '') ? 1 : 0);
  X_ITEMS = items;
  if (countEl) countEl.textContent = items.length;
  if (!items.length) return '<div class="text-center text-gray-500 py-12">暂无 X 热点数据</div>';
  const rows = items.map((f, i) => {
    const t = f.tweet, tg = f.target;
    const raw = xSummaryText(t, 120);        // 截断摘要 (未转义, 渲染处 esc)
    const title = xSummaryText(t, 0);        // 完整摘要 (title 属性)
    return `<tr id="x-tweet-${i}" onclick="openSplitPreview(${i})" title="点击查看详情">
      <td class="font-mono text-xs">${fmtMMDD(t.posted_at)}</td>
      <td><div class="truncate" title="${esc(tg.name)}">${esc(tg.name)}</div></td>
      <td><div class="truncate" title="${esc(title)}">${raw ? esc(raw) : '—'}</div></td>
      <td class="font-mono text-xs">${num(t.views)}</td>
      <td class="font-mono text-xs">${num(t.replies)}</td>
      <td class="font-mono text-xs">${num(t.likes)}</td>
      <td><button class="sp-row-btn" onclick="event.stopPropagation(); openSplitPreview(${i})">详情</button></td>
    </tr>`;
  }).join('');
  return `<table class="data-table"><thead><tr>
    <th style="width:110px">时间</th>
    <th style="width:130px">人物</th>
    <th>推文摘要</th>
    <th style="width:70px">浏览</th>
    <th style="width:60px">回复</th>
    <th style="width:60px">点赞</th>
    <th style="width:56px"></th>
  </tr></thead><tbody>${rows}</tbody></table>`;
}

// ===== Split Preview 分栏详情 (§5.3) =====
function openSplitPreview(i) {
  if (!X_ITEMS[i]) return;
  X_CUR = i;
  const f = X_ITEMS[i], t = f.tweet, tg = f.target;
  // 序号 (D4 D1): 该作者内位置/总数 · 全局位置/总数 (X_ITEMS 全局降序, V8 稳定排序 → 同作者子集保持降序, 与 spNav 同子集逻辑一致)
  const sameIdx = [];
  X_ITEMS.forEach((f2, idx) => { if (f2.targetIndex === f.targetIndex) sameIdx.push(idx); });
  document.getElementById('sp-title').textContent = (sameIdx.indexOf(i) + 1) + '/' + sameIdx.length + ' · ' + (i + 1) + '/' + X_ITEMS.length;
  // 正文 + forward (D2 2C): 同格式完整显示, forward 行区分样式; textContent 渲染 (SEC-1/O-1)
  const ft = document.getElementById('sp-full-text');
  if (t.text) ft.textContent = t.text;
  else ft.textContent = t.forward ? '' : '—';
  document.getElementById('sp-forward').textContent = t.forward ? 'forward: ' + t.forward : '';
  document.getElementById('sp-meta').textContent = '@' + tg.handle + ' · ' + fmtFull(t.posted_at);
  // 指标 kv 卡片 (null → —)
  const metrics = [['浏览', t.views], ['回复', t.replies], ['转推', t.retweets], ['点赞', t.likes]];
  document.getElementById('sp-metrics').innerHTML = metrics.map(m =>
    `<div class="sp-metric"><div class="sp-metric-v">${num(m[1])}</div><div class="sp-metric-k">${m[0]}</div></div>`
  ).join('');
  // 图片: 前端二次校验 https:// 前缀 (SEC-1, 双保险) + onerror 占位 (§5.4)
  const imgs = (t.images || []).filter(s => typeof s === 'string' && s.startsWith('https://'));
  document.getElementById('sp-images').innerHTML = imgs.length
    ? imgs.map(src => `<div class="sp-img-wrap"><img src="${esc(src)}" loading="lazy" onerror="imgFail(this)" alt="推文图片"><div class="sp-img-fail" style="display:none">图片加载失败</div></div>`).join('')
    : '';
  // 操作按钮行 (D2 B1+E1): 原文/作者主页 href 仅 https 白名单 (SEC-1); 拷贝每次打开重绑 (设计 §3.2)
  const linkBtn = document.getElementById('sp-act-link');
  const profBtn = document.getElementById('sp-act-profile');
  const copyBtn = document.getElementById('sp-act-copy');
  if (t.url && /^https:\/\//.test(t.url)) { linkBtn.href = t.url; linkBtn.style.display = 'inline-flex'; }
  else { linkBtn.removeAttribute('href'); linkBtn.style.display = 'none'; }
  if (tg.url && /^https:\/\//.test(tg.url)) { profBtn.href = tg.url; profBtn.style.display = 'inline-flex'; }
  else { profBtn.removeAttribute('href'); profBtn.style.display = 'none'; }
  copyBtn.style.display = 'inline-flex';
  copyBtn.onclick = () => copyTweet(f);
  document.getElementById('split-preview').classList.add('show');
  document.getElementById('split-backdrop').classList.add('show');
  document.addEventListener('keydown', onSplitKey);
}

// 拷贝推广素材 (CL003 D3 C2): 纯文本模板, textContent 安全 (SEC-1)
// 降级链: clipboard.writeText → copyTextFallback(execCommand); 成功 "已拷贝 ✓" 1500ms 复原, 失败 "拷贝失败" 2s 复原 (D5/B2)
function copyTweet(f) {
  const t = f.tweet, tg = f.target;
  const lines = [];
  lines.push('@' + (tg.handle || '') + (tg.name ? ' (' + tg.name + ')' : ''));
  lines.push(fmtFull(t.posted_at));
  const body = [t.text || '', t.forward ? 'forward: ' + t.forward : ''].filter(Boolean).join('\n');
  if (body) lines.push(body);
  lines.push('浏览 ' + num(t.views) + ' · 回复 ' + num(t.replies) + ' · 转推 ' + num(t.retweets) + ' · 点赞 ' + num(t.likes));
  if (t.url) lines.push('原文: ' + t.url);
  const btn = document.getElementById('sp-act-copy');
  const orig = '📋';
  const text = lines.join('\n');
  const feedback = (ok) => {
    btn.textContent = ok ? '已拷贝 ✓' : '拷贝失败';
    setTimeout(() => { btn.textContent = orig; }, ok ? 1500 : 2000);
  };
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(() => feedback(true)).catch(() => feedback(copyTextFallback(text)));
  } else {
    feedback(copyTextFallback(text));
  }
}

// 降级拷贝 (CL003 D5): textarea 临时节点 + execCommand('copy'), 返回 boolean (SEC-1 无 innerHTML, 结束移除节点)
function copyTextFallback(text) {
  const ta = document.createElement('textarea');
  ta.value = text;
  ta.setAttribute('readonly', '');
  ta.style.position = 'fixed';
  ta.style.top = '-9999px';
  document.body.appendChild(ta);
  try {
    ta.select();
    return document.execCommand('copy');
  } catch (e) {
    return false;
  } finally {
    document.body.removeChild(ta);
  }
}

// nav 上一/下一条: 同人物内循环切换 (§5.3)
function spNav(delta) {
  if (X_CUR == null || !X_ITEMS.length) return;
  const same = [];
  X_ITEMS.forEach((f, i) => { if (f.targetIndex === X_ITEMS[X_CUR].targetIndex) same.push(i); });
  const pos = same.indexOf(X_CUR);
  if (pos < 0) return;
  const next = (pos + delta + same.length) % same.length;
  openSplitPreview(same[next]);
}

function closeSplitPreview() {
  document.getElementById('split-preview').classList.remove('show');
  document.getElementById('split-backdrop').classList.remove('show');
  document.removeEventListener('keydown', onSplitKey);
}

function onSplitKey(e) {
  if (e.key === 'Escape') closeSplitPreview();
}

// 图片加载失败 → 占位块, 不破版 (§5.4)
function imgFail(img) {
  img.style.display = 'none';
  const fail = img.nextElementSibling;
  if (fail) fail.style.display = 'flex';
}

// ===== Stats =====
function updateStats() {
  document.getElementById('tc-hotspots').textContent=(DATA.hotspots||[]).length;
  document.getElementById('tc-providers').textContent=DATA.providers.length;
  document.getElementById('tc-people').textContent=DATA.people.length;
  document.getElementById('tc-tools').textContent=DATA.tools.length;
  document.getElementById('tc-llms').textContent=DATA.llms.length;
  document.getElementById('tc-xhotspots').textContent=X_DATA?(X_DATA.targets||[]).reduce((n,t)=>n+(t.tweets||[]).length,0):0;

  // Update time + ago label
  const ua = document.getElementById('updated-at');
  const ago = document.getElementById('ago-label');
  if (DATA.generated_at) {
    const d = new Date(DATA.generated_at);
    const mins = Math.floor((Date.now() - d.getTime()) / 60000);
    ua.textContent = d.toLocaleString('zh-CN');
    const h = Math.floor(mins / 60);
    const label = mins < 60 ? `${mins}分钟前` : h < 24 ? `${h}小时前` : `${Math.floor(h/24)}天前`;
    ago.innerHTML = label + ' <span class="text-gray-600 text-xs">🔗</span>';
    // Color: <24h normal, 1-5d warning, >5d danger
    if (h < 24) { ago.style.background='rgba(34,197,94,0.12)'; ago.style.color='#86efac'; }
    else if (h <= 120) { ago.style.background='rgba(250,204,21,0.12)'; ago.style.color='#facc15'; }
    else { ago.style.background='rgba(239,68,68,0.12)'; ago.style.color='#ef4444'; }
    // Click: localhost → copy command, otherwise → changelog
    const host = window.location.host;
    if (host.includes('127.0.0.1') || host.includes('localhost')) {
      ago.style.cursor = 'pointer'; ago.title = '点击复制采集命令';
      ago.onclick = () => {
        navigator.clipboard.writeText('cd ~/CodeSpace/llm-radar.lab && python3 llm-radar-collector.py run').then(() => {
          ago.innerHTML = '已复制 ✓ <span class="text-gray-600 text-xs">🔗</span>';
          setTimeout(() => { ago.innerHTML = label + ' <span class="text-gray-600 text-xs">🔗</span>'; }, 1500);
        });
      };
    } else {
      ago.style.cursor = 'pointer'; ago.title = '查看更新日志';
      ago.onclick = () => { window.location.href = 'changelog.html'; };
    }
  }

  // Data sources as filter chips (clickable to filter)
  renderSourceChips();
}

// ===== Init: two-stage loading =====
var overviewReady = false, snapshotReady = false;

function hideSkeleton() {
  if (!overviewReady || !snapshotReady) return;
  document.getElementById('skeleton').classList.add('hidden');
}

async function loadOverview() {
  try {
    var r = await fetch('overview.json', {cache:'no-cache'});
    if (!r.ok) throw new Error('HTTP ' + r.status);
    var o = await r.json();
    overviewReady = true;
    // Update time
    var t = document.getElementById('ov-update');
    if (t) t.textContent = o.t ? new Date(o.t).toLocaleString('zh-CN') : '—';
    // Update status
    var st = document.getElementById('ov-status');
    if (st) {
      st.textContent = o.r === 'success' ? '✅ 正常' : '❌ ' + (o.rd || '质量门禁未通过');
      st.className = 'px-1.5 py-0.5 rounded text-xs ' + (o.r === 'success' ? 'bg-green-900/50 text-green-400' : 'bg-red-900/50 text-red-400');
    }
    // Update hotspot preview
    var hs = document.getElementById('ov-hotspots');
    if (hs && o.h) {
      hs.textContent = '';
      o.h.forEach(function(h) {
        var span = document.createElement('span');
        span.className = 'text-xs text-gray-300';
        span.textContent = '🔥 ' + h.t;
        hs.appendChild(span);
      });
    }
    // Update tab counts
    if (o.s) {
      // pr=厂商 pe=人物 to=工具 ll=模型 ho=热点
      var map = {pr:'providers', pe:'people', to:'tools', ll:'llms', ho:'hotspots'};
      Object.keys(o.s).forEach(function(k) {
        var el = document.getElementById('tc-' + (map[k] || k));
        if (el) el.textContent = o.s[k];
      });
    }
    document.getElementById('overview-preview').classList.remove('hidden');
    if (snapshotReady) hideSkeleton();
  } catch(e) {
    overviewReady = true;
    console.warn('[llm-radar] overview.json load failed:', e.message);
  }
}

async function init() {
  // 1. Kick off overview.json immediately
  loadOverview();

  // 2. Load full snapshot.json
  try {
    var r = await fetch('data/snapshot.json', {cache:'no-cache'});
    if(!r.ok) throw new Error('Not found');
    DATA = await r.json();
    snapshotReady = true;
  } catch(e) {
    document.getElementById('loading').classList.add('hidden');
    document.getElementById('skeleton').classList.add('hidden');
    document.getElementById('error-msg').classList.remove('hidden');
    return;
  }
  document.getElementById('loading').classList.add('hidden');
  if (overviewReady) hideSkeleton();
  updateStats();
  checkRecentHotspots();
  loadTwitterData(); // X 热点独立数据 (失败不阻断页面, §5.1)
  // Restore auto-refresh preference
  if (localStorage.getItem('llm-radar-auto-refresh') === '1') { toggleAutoRefresh(); }
  // Restore state or parse hash
  const saved = localStorage.getItem('llm-radar-state');
  if (saved) { restoreState(); switchTab(activeTab); }
  else { const {tab,focus}=parseHash(); switchTab(tab,focus); }
  document.querySelectorAll('.tab-btn').forEach(b=>b.addEventListener('click',()=>switchTab(b.dataset.tab)));
  window.addEventListener('hashchange',()=>{
    const {tab,focus}=parseHash();
    if(tab!==activeTab||focus) switchTab(tab,focus);
  });
}

document.addEventListener('DOMContentLoaded',init);
</script>
